name: CI for wxPdfDoc
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Install dependencies (Linux)
      run: |
        sudo apt-get -qq update
        #sudo apt-get install -y libwxgtk3.0-gtk3-dev
        #sudo add-apt-repository ppa:kicad/kicad-7.0-releases
        sudo apt update
        sudo apt-get install -y libwxgtk3.2-dev
        sudo apt-get install -y libzint-dev libwoff-dev libfontconfig-dev
        # Fonts used by the automated tests (metric-compatible replacements of the standard fonts)
        sudo apt-get install -y fonts-liberation
      if: matrix.os == 'ubuntu-latest'
    - name: Install dependencies (macOS)
      run: |
        # brew update
        brew install automake
        brew install wxwidgets
        brew install zint
        brew install woff2
      if: matrix.os == 'macos-latest'
    - name: Checkout
      uses: actions/checkout@v3
    - name: Configure
      run: |
        autoreconf
        ./configure
    - name: Build
      run: |
        make
    - name: Automated tests
      run: |
        make check
    - name: Testing
      run: |
        pwd
        ./samples/minimal/minimal -t -s ./samples/minimal -f ../../lib/fonts
    - name: Automated tests
      run: |
        make check
    - name: Installing
      run: |
        sudo make install
